name: 毎日詰将棋の素材づくり

# 日本時間の朝7時に、翌日配信ぶんの素材（問題図・解答動画・投稿文）を用意する。
# 公開（dev -> main のマージ）はしない。人が中身を確認してから手で公開する。
#
# 素材が「翌日ぶん」なのは、投稿文のURL(#tsume)が開くのが「その日の問題」だから。
# 前日に用意 → 内容を確認して main へ公開 → 当日に投稿、という順で余裕を持たせる。

on:
  schedule:
    - cron: "0 22 * * *"      # 22:00 UTC = 翌07:00 JST
  workflow_dispatch:
    inputs:
      no:
        description: "出題番号を指定して作り直す（空なら翌日ぶん）"
        required: false

permissions:
  contents: read

concurrency:
  group: daily-tsume
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: 日本語フォントと ffmpeg を入れる
        # ランナーには日本語フォントが無く、入れないと盤の駒も見出しも豆腐になる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - name: KomoringHeights のビルド結果を使い回す
        uses: actions/cache@v4
        with:
          path: tools/engines
          key: kh-engine-v1.1.0-${{ runner.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/package-lock.json

      # 開発用の依存は tools/ に置いている（リポジトリ直下に package.json を置くと
      # Cloudflare のビルドが不要なインストールを始めて数分かかるため）
      - run: npm ci
        working-directory: tools
      - run: npx playwright install --with-deps chromium
        working-directory: tools

      - name: index.html が problems.json と一致しているか確認
        # ずれていると、素材と実際に配信される問題が食い違う
        run: python3 tools/tsume/publish.py --check

      - name: 配信ストックの残りを確認
        continue-on-error: true      # 残り少なくても素材づくりは続ける
        run: python3 tools/tsume/check_stock.py --min 7

      - name: 明日以降の問題に余詰め・早詰みがないか検証（アプリの指し手生成で）
        # 人がブラウザで手作業で検証していたときに、余詰めを2度見逃した。
        # 配信済みの回は書き換えない決まりなので、まだ差し替えられる回だけを関門にする
        run: node tools/tsume/verify.js --upcoming

      - name: KomoringHeights を用意する
        # Linux 版のバイナリ配布がないのでソースからビルドする。ビルドは数分かかるため
        # キャッシュする（エンジン自体はリポジトリに含めない。GPLv3・別プロセス呼び出し）
        id: kh
        run: |
          echo "path=$(tools/tsume/setup_engine.sh | tail -1)" >> "$GITHUB_OUTPUT"

      - name: 同じ問題を別実装の詰将棋エンジンでも検証
        # verify.js はアプリ本体の指し手生成を使うので、その実装自体の
        # 思い違いには気づけない。まったく別の実装で突き合わせる
        env:
          KH_ENGINE: ${{ steps.kh.outputs.path }}
        run: |
          python3 -m venv tools/.venv
          tools/.venv/bin/pip install -q -r tools/requirements.txt
          tools/.venv/bin/python tools/tsume/verify_kh.py --upcoming

      - name: 素材をつくる
        run: |
          if [ -n "${{ inputs.no }}" ]; then
            node tools/tsume/render_video.js --no "${{ inputs.no }}"
          else
            node tools/tsume/render_video.js --tomorrow
          fi

      # 素材の保存を先に行う。表示用の整形で失敗しても素材は必ず残るようにする
      # （以前、投稿文の表示ステップが失敗して Artifacts がスキップされ、
      #   その日の素材がまるごと失われた）
      - uses: actions/upload-artifact@v4
        with:
          name: tsume-assets
          path: dist/movie/
          retention-days: 30
          if-no-files-found: error

      - name: 投稿文を実行結果に載せる
        continue-on-error: true      # 表示だけの処理なので、失敗しても実行全体は止めない
        run: |
          {
            echo "## X投稿の下書き"
            echo
            # 素材は配信日フォルダに入る（dist/movie/2026-09-04/投稿文.txt）
            for f in dist/movie/*/投稿文.txt; do
              [ -e "$f" ] || continue
              echo "### $(basename "$(dirname "$f")")"
              echo '```'
              cat "$f"
              echo '```'
              echo
            done
            echo "添付する画像と動画は、上の Artifacts からダウンロードしてください。"
          } >> "$GITHUB_STEP_SUMMARY"
